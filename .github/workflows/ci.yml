name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Collect tests
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          tests = list(root.glob('_test_*.py')) + list(root.glob('tests/test_*.py'))
          print('found', len(tests), 'test files')
          for t in tests:
              print(t)
          if not tests:
              raise SystemExit('no tests found')
          PY
      - name: Run unit-style tests (non-e2e)
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          # e2e/heavy scripts may need GUI/Windows wallpaper APIs — skip on Linux CI
          skip = {'_test_e2e.py'}
          files = [p for p in list(Path('.').glob('_test_*.py')) + list(Path('tests').glob('test_*.py')) if p.name not in skip]
          failed = []
          for f in files:
              print('===', f, '===')
              r = subprocess.run([sys.executable, str(f)], timeout=180)
              if r.returncode != 0:
                  failed.append(str(f))
          if failed:
              print('FAILED', failed)
              raise SystemExit(1)
          print('all selected tests ok')
          PY
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install portable test deps
        run: |
          pip install -U pip
      - name: Portable checks (must pass on Linux)
        run: python tests/test_ci_portable.py
      - name: Windows-only scripts skipped on Linux
        run: |
          echo "SKIP on Linux: _test_panel_ui.py (playwright+win32 UI)"
          echo "SKIP on Linux: _test_panel_api.py / _test_preview.py (panel.pyw imports win32api)"
          echo "本地 Windows 请执行: python _test_panel_api.py / _test_preview.py / _test_e2e.py"
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

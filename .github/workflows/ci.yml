name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          pip install -U pip
          pip install pillow
          # playwright 仍可选：缺依赖用例 skip，但 pillow 必须装上
      - name: Collect tests
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          tests = list(root.glob('_test_*.py')) + list(Path('tests').glob('test_*.py'))
          print('found', len(tests), 'test files')
          for t in tests:
              print(t)
          if not tests:
              raise SystemExit('no tests found')
          PY
      - name: Run unit-style tests (non-e2e, skip missing-deps)
        run: |
          python - <<'PY'
          import ast
          import importlib.util
          import subprocess
          import sys
          from pathlib import Path

          skip_names = {'_test_e2e.py'}  # Windows wallpaper APIs
          optional = {'playwright', 'PIL'}

          def optional_imports(path: Path) -> set:
              try:
                  tree = ast.parse(path.read_text(encoding='utf-8', errors='ignore'))
              except Exception:
                  return set()
              found = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          root = a.name.split('.')[0]
                          if root in optional:
                              found.add(root)
                  elif isinstance(node, ast.ImportFrom):
                      if node.module:
                          root = node.module.split('.')[0]
                          if root in optional:
                              found.add(root)
              return found

          files = [p for p in list(Path('.').glob('_test_*.py')) + list(Path('tests').glob('test_*.py'))
                   if p.name not in skip_names]
          failed = []
          skipped = []
          ran = []
          for f in files:
              need = optional_imports(f)
              missing = [m for m in need if importlib.util.find_spec(m) is None]
              if missing:
                  skipped.append(f"{f} (missing {missing})")
                  print('SKIP', f, 'missing', missing)
                  continue
              print('===', f, '===')
              r = subprocess.run([sys.executable, str(f)], timeout=180)
              if r.returncode != 0:
                  failed.append(str(f))
              else:
                  ran.append(str(f))
          print('ran:', ran)
          print('skipped:', skipped)
          if failed:
              print('FAILED', failed)
              raise SystemExit(1)
          if not ran:
              print('HARD FAIL: all tests skipped')
              raise SystemExit(2)
          print('selected tests ok, ran=', len(ran), 'skipped=', len(skipped))
          PY

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
